name: Installation problem
description: Report a download, installation or startup error.
title: "[install] <step that failed> on <device>"
labels: ["install-problem"]
body:
  - type: markdown
    attributes:
      value: |
        For playback results, tap **Send playback results** in Roon Bridge. Do not attach the Roon archive, a packed APK, or anything from Roon's files.
  - type: dropdown
    id: step
    attributes:
      label: Where it stopped
      options:
        - Installing the packager APK
        - Downloading Roon Bridge from Roon
        - Downloading the Android app
        - Downloading supporting libraries
        - Packing or verification
        - Signing
        - Android install prompt
        - Roon Bridge opens but says files are missing
        - Roon Bridge crashes on startup
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "iBasso DX260, Android 11 (SDK 30)"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Packager version and Android app version (under Technical details)
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error text shown
      description: Copy the message shown on screen.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Packager log
      description: "Optional: copy the log under Technical details. Remove personal information before posting."
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Anything else
