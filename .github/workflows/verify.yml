name: Verify packager
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 scripts/check-source-only.py
      - run: gradle -p android testDebugUnitTest assembleDebug assembleRelease --console=plain
      - run: python3 scripts/check-apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - run: python3 scripts/check-apk.py android/app/build/outputs/apk/release/app-release-unsigned.apk
